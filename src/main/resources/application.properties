spring.application.name=level-up-gamer-backend-berna

# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/level_up_gamer
spring.datasource.username=levelup_app
spring.datasource.password=${MYSQL_PASSWORD}

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Seguridad JWT
app.jwt.secret=${JWT_SECRET}