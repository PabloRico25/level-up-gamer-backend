spring.application.name=level-up-gamer
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
server.port=${SERVER_PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
app.jwt.secret=${JWT_SECRET}
app.auth.cookie-secure=${COOKIE_SECURE:false}
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-stacktrace=never
server.error.include-message=never
