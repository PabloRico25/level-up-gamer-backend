spring.application.name=level-up-gamer-backend-berna

# Lee las claves desde un archivo .env local (ignorado por Git). Si no existe, usa las variables de entorno.
spring.config.import=optional:file:.env[.properties]

# Base de datos (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup?serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:levelup_user}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
# Temporal: la tabla usuario todavia no tiene migracion (la escribe Berna en V2).
# Cuando V2 entre a main, esto vuelve a "validate".
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
# Tres personas agregan migraciones al mismo tiempo (V1 Alex, V2 Berna, V3 Gabo).
spring.flyway.out-of-order=true

server.port=8080

# Origenes del frontend para CORS, separados por coma.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html